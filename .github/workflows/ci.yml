name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  n8n:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: n8n/package-lock.json
      # isolated-vm (pulled in for `n8n-node dev`) needs a native build we don't use here.
      - run: npm ci --ignore-scripts
      - run: npx n8n-node lint
      - run: npx n8n-node build
      - run: node --test --experimental-strip-types ../tests/n8n-helpers.test.ts

  zapier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zapier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zapier/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx zapier-platform validate

  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JSON is valid
        run: node -e "const fs=require('fs');const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(d+'/'+e.name):[d+'/'+e.name]);for(const f of walk('make').filter(f=>f.endsWith('.json')))JSON.parse(fs.readFileSync(f,'utf8'));"
      - name: Custom IML functions
        run: node tests/make-functions.test.js
